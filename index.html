<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#080b10">
  <title>Audi Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #121821;
      --panel-active: #1b2531;
      --border: #283342;
      --muted: #91a0b2;
      --text: #f5f7fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 50% -15%, rgba(48, 113, 163, .22), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      user-select: none;
    }
    .header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px clamp(16px, 3vw, 30px) 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .audi-mark {
      width: 34px; height: 15px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      color: #dce5ee; font-size: 10px; letter-spacing: -2px;
      border: 1px solid #7f8b99; border-radius: 50%;
      transform: scaleX(1.25);
    }
    .heading { font-size: clamp(17px, 2.3vw, 21px); font-weight: 650; letter-spacing: .4px; }
    .subheading { margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; }
    .clock { font-size: clamp(18px, 2.5vw, 23px); font-variant-numeric: tabular-nums; color: #d9e3ed; }
    .grid {
      flex: 1 1 auto; min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(8px, 1.6vw, 15px);
      padding: clamp(12px, 2vw, 20px);
    }
    .btn {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(7px, 1.2vh, 12px);
      padding: 10px 6px;
      color: var(--text); text-decoration: none; text-align: center;
      background: linear-gradient(145deg, rgba(25,34,46,.98), rgba(15,21,29,.98));
      border: 1px solid var(--border); border-radius: clamp(14px, 2vw, 22px);
      box-shadow: 0 5px 16px rgba(0,0,0,.18);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      -webkit-user-drag: none;
    }
    .btn:active { transform: scale(.97); background: var(--panel-active); border-color: #52677f; }
    .logo-wrap {
      width: clamp(38px, 6vw, 58px); height: clamp(38px, 6vw, 58px);
      display: flex; align-items: center; justify-content: center;
    }
    .logo { display: block; width: 100%; height: 100%; object-fit: contain; }
    .logo-text { font-size: clamp(34px, 5vw, 48px); line-height: 1; font-weight: 700; }
    .label { font-size: clamp(13px, 1.7vw, 17px); font-weight: 600; letter-spacing: .15px; }
    .hint { color: var(--muted); font-size: 10px; font-weight: 400; margin-top: 3px; }
    .footer {
      flex: 0 0 auto; text-align: center; color: #738092;
      padding: 7px 12px max(10px, env(safe-area-inset-bottom));
      font-size: 11px; letter-spacing: .5px;
      border-top: 1px solid rgba(255,255,255,.07);
    }
    @media (max-width: 650px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }
      .logo-wrap { width: clamp(34px, 9vw, 48px); height: clamp(34px, 9vw, 48px); }
      .label { font-size: 14px; }
      .hint { display: none; }
    }
    @media (max-height: 420px) {
      .header { padding-top: 7px; padding-bottom: 7px; }
      .grid { gap: 7px; padding: 8px 12px; }
      .btn { gap: 4px; padding: 5px; border-radius: 12px; }
      .logo-wrap { width: 30px; height: 30px; }
      .label { font-size: 12px; }
      .footer { padding: 4px 8px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="audi-mark" aria-hidden="true">○○○○</div>
      <div>
        <div class="heading">Audi Dashboard</div>
        <div class="subheading">Q4 e-tron · Atalhos</div>
      </div>
    </div>
    <div class="clock" id="clock" aria-label="Hora">--:--</div>
  </header>
